[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "genpark-value-at-risk-cvar-expected-shortfall-skill"
version = "1.0.0"
description = "Portfolio Value-at-Risk (VaR) and Conditional VaR (Expected Shortfall) engine calculating tail risk across parametric and historical loss distributions."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence"
]
